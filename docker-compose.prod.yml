name: quote-wall

services:
  quote_wall_db:
    image: postgres:16-alpine
    container_name: quote_wall_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-quote_wall_database}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-quote_wall_database}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  quote_wall_app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: quote_wall_app
    restart: unless-stopped
    depends_on:
      quote_wall_db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD}@quote_wall_db:5432/${DB_NAME:-quote_wall_database}
      NEXTAUTH_URL: ${NEXTAUTH_URL}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: quote_wall_tunnel
    restart: unless-stopped
    depends_on:
      - quote_wall_app
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}

volumes:
  postgres_data: